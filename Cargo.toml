[package]
name = "fov"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Turn plain-language requests into reusable shell pipelines, previewed on your data in a sandbox"
authors = ["Sven Taute"]
license = "MIT"
readme = "README.md"
keywords = ["cli", "llm", "shell", "pipeline", "awk"]
categories = ["command-line-utilities", "text-processing"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[[bin]]
name = "fov"
path = "src/main.rs"

# The eval harness is a development tool: `cargo run --features eval --bin fov-eval`.
[[bin]]
name = "fov-eval"
path = "src/bin/fov-eval.rs"
required-features = ["eval"]

[features]
eval = []

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.43.0", default-features = false, features = ["rustls", "chat-completion", "responses", "byot"] }
aws-config = { version = "1.13.2", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-bedrockruntime = "1.155.0"
aws-smithy-types = "1.9.4"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream", "use-dev-tty"] }
duct = "1.1.2"
futures-util = "0.3.34"
libc = "0.2.191"
memchr = "2.8.3"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "signal"] }
toml = "1.2.1"
tui-input = { version = "0.15.5", default-features = false }
which = "8.0.6"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"

[dev-dependencies]
aws-smithy-http-client = { version = "1.5.2", features = ["test-util"] }
insta = "1.49.0"
